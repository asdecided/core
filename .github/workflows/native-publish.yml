name: Publish native release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  changelog:
    name: Verify release changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Require one matching SemVer entry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/verify-release-changelog.sh "$RELEASE_TAG"

  verification:
    name: Full native release battery
    uses: ./.github/workflows/rust-spike.yml
    with:
      ref: ${{ github.event.release.tag_name }}
    permissions:
      contents: read

  metadata:
    name: Generate release notices
    needs: [verification, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show
      - name: Generate Cargo dependency notices
        run: ./scripts/generate-third-party-notices.sh
      - uses: actions/upload-artifact@v7
        with:
          name: asdecided-third-party-notices
          path: THIRD-PARTY-NOTICES
          if-no-files-found: error

  binaries:
    needs: [verification, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          name: asdecided-third-party-notices
      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build native binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          (cd rust && DECIDED_RS_VERSION="$VERSION" cargo build --release --locked -p decided -p decided-mcp)
      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          mkdir -p package
          cp LICENSE NOTICE THIRD-PARTY-NOTICES package/
          cp rust/target/release/decided rust/target/release/decided-mcp package/
          tar -C package -czf "dist/asdecided-${TARGET}.tar.gz" .
      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist,package | Out-Null
          Copy-Item LICENSE,NOTICE,THIRD-PARTY-NOTICES -Destination package
          Copy-Item rust/target/release/decided.exe,rust/target/release/decided-mcp.exe -Destination package
          Compress-Archive -Path package\* -DestinationPath dist/asdecided-${{ matrix.target }}.zip
      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/asdecided-${{ matrix.target }}.${{ matrix.archive }}
      - name: Attach binaries to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  evidence:
    name: Publish release verification pack
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern 'asdecided-*.tar.gz' \
            --pattern 'asdecided-*.zip'
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum asdecided-*.tar.gz asdecided-*.zip > SHA256SUMS
      - name: Attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: rust
          format: cyclonedx-json
          output-file: dist/asdecided-${{ github.event.release.tag_name }}-sbom.cdx.json
          upload-artifact: false
      - name: Attach CycloneDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "dist/asdecided-${RELEASE_TAG}-sbom.cdx.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Attest CycloneDX SBOM
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/asdecided-${{ github.event.release.tag_name }}-sbom.cdx.json

  image:
    needs: [verification, changelog, metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/asdecided/core
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          name: asdecided-third-party-notices
      - name: Build and smoke-test CLI image
        run: |
          docker build --target asdecided-cli --build-arg DECIDED_VERSION="$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:$TAG" --version
      - name: Build and smoke-test MCP image
        run: |
          MCP_IMAGE="$IMAGE:mcp-$TAG"
          docker build --target asdecided-mcp --build-arg DECIDED_VERSION="$TAG" -t "$MCP_IMAGE" -t "$IMAGE:mcp-latest" .
          RESPONSE="$(printf '%s\n' '{"jsonrpc":"2.0","id":"discover","method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"release-smoke","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' | docker run --rm -i -v "$PWD:/work:ro" "$MCP_IMAGE" --root /work)"
          test "$(printf '%s' "$RESPONSE" | jq -r '.result.serverInfo.name')" = "decided-mcp"
          test "$(printf '%s' "$RESPONSE" | jq -r '.result.serverInfo.version')" = "${TAG#v}"
      - name: Publish CLI and MCP images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:mcp-$TAG"
          docker push "$IMAGE:mcp-latest"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign published images with GitHub OIDC
        run: |
          for reference in \
            "$IMAGE:$TAG" \
            "$IMAGE:latest" \
            "$IMAGE:mcp-$TAG" \
            "$IMAGE:mcp-latest"; do
            cosign sign --yes "$reference"
          done

  mcp-registry:
    name: Publish to MCP Registry
    needs: [evidence, image]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry-publish.yml
    with:
      version: ${{ github.event.release.tag_name }}

  crates:
    name: Dispatch crates.io publication
    needs: [mcp-registry]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Dispatch trusted publisher workflow
        run: >-
          gh workflow run crates-publish.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "${{ github.event.repository.default_branch }}"
          -f version="$RELEASE_TAG"
