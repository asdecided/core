name: Publish to MCP Registry

on:
  workflow_call:
    inputs:
      version:
        description: Exact released version to register (X.Y.Z or vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact released version to register (X.Y.Z or vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.normalize.outputs.number }}
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - name: Normalize and validate version
        id: normalize
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          case "$VERSION" in
            v*|V*) VERSION="${VERSION:1}" ;;
          esac
          SEMVER_COMPONENT='(0|[1-9][0-9]*)'
          if [[ ! "$VERSION" =~ ^${SEMVER_COMPONENT}\.${SEMVER_COMPONENT}\.${SEMVER_COMPONENT}$ ]]; then
            echo "::error::release version must be SemVer X.Y.Z or vX.Y.Z, got: $REQUESTED_VERSION"
            exit 1
          fi
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  changelog:
    name: Verify release changelog
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Require one matching SemVer entry
        run: ./scripts/verify-release-changelog.sh "${{ needs.version.outputs.number }}"

  verification:
    name: Full native release battery
    needs: version
    uses: ./.github/workflows/rust-spike.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read

  publish:
    needs: [version, verification, changelog]
    runs-on: ubuntu-latest
    environment: mcp-registry
    concurrency:
      group: mcp-registry-publish-${{ needs.version.outputs.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Verify requested version and OCI metadata
        env:
          REQUESTED_VERSION: ${{ needs.version.outputs.number }}
        run: |
          WORKSPACE_VERSION="$(cargo metadata --manifest-path rust/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "decided-mcp") | .version')"
          SERVER_VERSION="$(jq -r '.version' server.json)"
          PACKAGE_IDENTIFIER="$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)"
          test "$REQUESTED_VERSION" = "$WORKSPACE_VERSION"
          test "$REQUESTED_VERSION" = "$SERVER_VERSION"
          test "$PACKAGE_IDENTIFIER" = "ghcr.io/asdecided/core:mcp-v$REQUESTED_VERSION"
      - name: Verify MCP image is available and canonical
        env:
          REQUESTED_VERSION: ${{ needs.version.outputs.number }}
        run: |
          IMAGE="ghcr.io/asdecided/core:mcp-v$REQUESTED_VERSION"
          for attempt in {1..30}; do
            : "$attempt"
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE did not reach GHCR"
            exit 1
          fi
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' "$IMAGE")" = "io.github.asdecided/core"
          test "$(docker image inspect --format '{{ json .Config.Entrypoint }}' "$IMAGE")" = '["decided-mcp"]'
      - name: Install checksum-pinned MCP publisher
        env:
          PUBLISHER_VERSION: 1.8.0
          PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/${ARCHIVE}"
          echo "${PUBLISHER_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "$ARCHIVE" mcp-publisher
      - name: Validate Registry metadata
        run: ./mcp-publisher validate
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish Registry metadata
        run: ./mcp-publisher publish
