[package]
name = "decided"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Engineering decisions your agents can follow"
readme = "README.md"
keywords = ["decisions", "architecture", "agents", "cli", "offline"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

# `cargo binstall decided` downloads the prebuilt release archive instead of
# compiling. Every native release archive carries both executables at its root.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/asdecided-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/asdecided-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
rac-engine = { package = "asdecided-core", version = "=0.31.1", path = "../rac-engine" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"
